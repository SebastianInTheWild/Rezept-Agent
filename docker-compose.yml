services:
  rezept-agent:
    build: .
    image: rezept-agent
    container_name: rezept-agent
    restart: unless-stopped
    env_file: .env
    volumes:
      # Agenten liegen auf dem Host: neue Ordner oder Änderungen gelten ohne Neubau
      - ./agents:/agents:ro
      # Merkliste, Sicherungen und Logs
      - agents-data:/data

volumes:
  agents-data:
