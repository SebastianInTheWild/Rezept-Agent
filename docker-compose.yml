services:
  agents:
    build: .
    image: ha-unser-zuhause-rezepte
    container_name: ha-unser-zuhause-rezepte
    restart: unless-stopped
    env_file: .env
    volumes:
      # Agenten liegen auf dem Host: neue Ordner oder Änderungen gelten ohne Neubau
      - ./agents:/agents:ro
      # Merkliste, Sicherungen und Logs
      - agents-data:/data

volumes:
  agents-data:
