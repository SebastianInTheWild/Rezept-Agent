services:
  rezept-agent:
    build: .
    image: rezept-agent
    container_name: rezept-agent
    restart: unless-stopped
    env_file: .env
    environment:
      # agents/ ist hier schreibgeschützt eingebunden – Abgleich mit GitHub nur in der Portainer-Variante
      AGENTS_SYNC: aus
      APP_SYNC: aus
      # Google-Modell für KI-Fotos (Wert aus .env, sonst Standard)
      GOOGLE_BILD_MODELL: ${GOOGLE_BILD_MODELL:-gemini-nano-banana-2.1}
    volumes:
      # Agenten liegen auf dem Host: neue Ordner oder Änderungen gelten ohne Neubau
      - ./agents:/agents:ro
      # Merkliste, Sicherungen und Logs
      - agents-data:/data

volumes:
  agents-data:
