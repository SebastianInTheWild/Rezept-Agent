# Baut das Container-Image (Programm, Agenten, Claude Code) und legt es in der GitHub Container Registry ab:
#   ghcr.io/sebastianinthewild/rezept-agent:latest  (+ :<Version>, z. B. :2026-11-03_10-11, und :sha-<commit>)
# Bei jedem Push auf main, der app/, agents/, Dockerfile oder das Slack-Manifest ändert, jeden Montag neu
# (frische Basis und aktuelles Claude Code) und von Hand unter Actions → „Image bauen“ → Run workflow.
# Optional: Secret PORTAINER_WEBHOOK (Webhook-URL des Stacks in Portainer) – dann wird der Stack danach sofort neu geladen.
name: Image bauen

on:
  push:
    branches: [main]
    paths: ["app/**", "agents/**", "Dockerfile", "slack-app-manifest.yml", ".github/workflows/image.yml"]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write # Changelog: Version nach dem Bau eintragen
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ganze Historie: Version aus dem letzten Programm-Commit, Changelog zurückschreiben

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Version = Zeitpunkt des letzten Commits auf main, der das Programm ändert (dieselben Pfade wie oben unter „paths“),
      # in deutscher Zeit („2026-11-03 10-11“) – jeder gemergte Pull Request ergibt eine neue Version; der wöchentliche
      # Neubau und der Changelog-Commit danach ändern sie nicht. Als Tag ohne Leerzeichen: 2026-11-03_10-11
      - id: zeit
        run: |
          code=(-- app agents Dockerfile slack-app-manifest.yml .github/workflows/image.yml)
          echo "jetzt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git log -1 --first-parent --format=%H "${code[@]}")" >> "$GITHUB_OUTPUT"
          echo "version=$(TZ=Europe/Berlin git log -1 --first-parent --format=%cd --date=format-local:'%Y-%m-%d %H-%M' "${code[@]}")" >> "$GITHUB_OUTPUT"
          echo "tag=$(TZ=Europe/Berlin git log -1 --first-parent --format=%cd --date=format-local:'%Y-%m-%d_%H-%M' "${code[@]}")" >> "$GITHUB_OUTPUT"
          # PR-Nummer aus „Merge pull request #17 …“ bzw. bei Squash-Merge „Titel (#17)“
          echo "pr=$(git log -1 --first-parent --format=%s "${code[@]}" | sed -n -e 's/^Merge pull request #\([0-9]*\).*/\1/p' -e 's/.*(#\([0-9]*\))$/\1/p' | head -1)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.zeit.outputs.tag }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.zeit.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Version und Bauzeit für die Neustart-Meldung in Slack (stehen im Dockerfile hinter den großen Schichten,
          # der Cache für apt/yt-dlp/Claude Code bleibt also erhalten)
          build-args: |
            APP_VERSION=${{ steps.zeit.outputs.commit }}
            APP_RELEASE=${{ steps.zeit.outputs.version }}
            APP_BUILD=${{ steps.zeit.outputs.jetzt }}
          # Montags ohne Cache bauen, damit Basis-Image und Claude Code wirklich neu sind
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Portainer-Stack neu laden
        env:
          PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        if: env.PORTAINER_WEBHOOK != ''
        run: curl -fsS -X POST "$PORTAINER_WEBHOOK"

      # CHANGELOG: „Unveröffentlicht“ wird zur gebauten Version (mit PR und Image-Tag) und zurück nach main geschrieben.
      # Nur nach einem Push (Merge), nicht beim wöchentlichen Neubau. Ist main geschützt, schlägt nur dieser Schritt fehl.
      - name: Changelog – Version eintragen
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          VERSION: ${{ steps.zeit.outputs.version }}
          TAG: ${{ steps.zeit.outputs.tag }}
          PR: ${{ steps.zeit.outputs.pr }}
        run: |
          git fetch -q origin main
          git checkout -q -B main origin/main
          node .github/changelog-version.mjs CHANGELOG.md "$VERSION" "$TAG" "$PR"
          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "CHANGELOG: Version $VERSION (Image-Tag $TAG)" CHANGELOG.md
            git push -q origin main
          fi
