# Rezept-Agent für Portainer. Das Programm kommt als fertiges Image aus GitHub (GitHub Actions baut es bei jedem Push auf main),
# die Daten liegen in einem Ordner auf dem Docker-Host:
#
#   /home/sebastian/docker/rezepte/
#     zeitplan.conf   Wann welcher Agent läuft (Änderungen gelten ohne Neustart)
#     agents/         Ein Ordner je Agent (agent.json + prompt.md) – wird alle 10 Minuten aus GitHub aktualisiert
#     daten/          Merklisten, Logs, Sicherungen, Einstellungen aus der Weboberfläche (umgebung.json)
#
# Zugangsdaten entweder hier unter „Environment variables“ oder in der Weboberfläche unter „Einstellungen“ (hat Vorrang).
#
# Der Container läuft als Benutzer 1000 (Besitzer von /home/sebastian/docker), damit du alle Dateien ohne sudo bearbeiten kannst.
services:
  agents:
    image: ghcr.io/sebastianinthewild/rezept-agent:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: rezepte
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      # Zugangsdaten: in Portainer unter „Environment variables“ eintragen (Vorlage: .env.example)
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      TANDOOR_URL: ${TANDOOR_URL:-https://app.tandoor.dev}
      TANDOOR_TOKEN: ${TANDOOR_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-}
      # Slack-Manifest automatisch einspielen (optional): App-ID und Refresh-Token der App-Konfiguration
      SLACK_APP_ID: ${SLACK_APP_ID:-}
      SLACK_CONFIG_TOKEN: ${SLACK_CONFIG_TOKEN:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_AI_TOKEN: ${CF_AI_TOKEN:-}
      BILD_ANBIETER: ${BILD_ANBIETER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Google-Modell: gemini-nano-banana-2.1 (Standard) | gemini-2.5-flash-image (günstiger) | gemini-3-pro-image (beste Qualität)
      GOOGLE_BILD_MODELL: ${GOOGLE_BILD_MODELL:-gemini-nano-banana-2.1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Rezepte aus Reels/Shorts: Gemini sieht sich das Video an (GEMINI_API_KEY von oben); optional Cookies, falls Instagram blockt
      GEMINI_VIDEO_MODELL: ${GEMINI_VIDEO_MODELL:-}
      VIDEO_MAX_SEKUNDEN: ${VIDEO_MAX_SEKUNDEN:-}
      VIDEO_COOKIES: ${VIDEO_COOKIES:-}
      BILD_PRO_TAG: ${BILD_PRO_TAG:-}
      WEB_PASSWORT: ${WEB_PASSWORT:-}
      # agents/ alle N Minuten aus GitHub holen (neue Agenten ohne Neustart), „aus“ = nie
      AGENTS_SYNC: ${AGENTS_SYNC:-10}
      TZ: ${TZ:-Europe/Berlin}
      AGENTS_DIR: /data/agents
      DATA_DIR: /data/daten
      SCHEDULE_FILE: /data/zeitplan.conf
      DISABLE_AUTOUPDATER: "1"
    # Weboberfläche „Zeitplan“ (Port 8080 im Container) über Nginx Proxy Manager im ProxyNetwork.
    # Der Homepage-Agent legt aus homepage-agent.* DNS-Eintrag und Proxy-Host an, homepage.* ist die Kachel.
    # Passwort optional über die Umgebungsvariable WEB_PASSWORT.
    labels:
      homepage-agent.domain: ${WEB_DOMAIN:-rezepte.hamm.schmalzbauer.work}
      homepage-agent.port: "8080"
      homepage.group: SmartHome
      homepage.name: Rezepte
      homepage.icon: mdi-chef-hat
      homepage.href: https://${WEB_DOMAIN:-rezepte.hamm.schmalzbauer.work}
      homepage.description: Recipe agents for Tandoor (Slack bridge, quality check)
      # What's Up Docker: neue Builds von :latest erkennen (Digest), damit es mit einem Docker-Trigger automatisch aktualisiert
      wud.tag.include: "^latest$"
      wud.watch.digest: "true"
    networks:
      - ProxyNetwork
    volumes:
      - ${AGENTS_HOST_DIR:-/home/sebastian/docker/rezepte}:/data

networks:
  ProxyNetwork:
    external: true
