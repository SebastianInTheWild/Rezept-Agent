# Unser Zuhause – Agenten, Volume-Variante: Programm und Agenten liegen im Volume (/data/app, /data/agents).
# Vorteil: Updates ohne Stack-Änderung (Dateien ins Volume legen, Container neu starten) – die Tokens bleiben unberührt.
# Erstbefüllung des Volumes: einmal portainer/stack.yml deployen oder die Ordner app/ und agents/ nach /data kopieren.
services:
  agents:
    image: node:22-bookworm-slim
    container_name: ha-unser-zuhause-agents
    restart: unless-stopped
    working_dir: /data/app
    command: ["sh", "/data/app/start.sh"]
    environment:
      HA_URL: ${HA_URL:-http://192.168.11.252:8123}
      HA_TOKEN: ${HA_TOKEN:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      NOTIFY_PERSONS: ${NOTIFY_PERSONS:-person.sebastian}
      SKIP_LABEL: ${SKIP_LABEL:-Test}
      TZ: ${TZ:-Europe/Berlin}
      AGENTS_DIR: /data/agents
      DATA_DIR: /data
      DISABLE_AUTOUPDATER: "1"
    volumes:
      - agents-data:/data

volumes:
  agents-data:
