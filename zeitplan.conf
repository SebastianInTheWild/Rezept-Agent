# Zeitplan der Agenten – Änderungen gelten nach spätestens 30 Sekunden, ohne Neustart.
#
#   <agent> = <Zeit>                 täglich, z. B.  log-detektiv = 07:30
#   <agent> = <Tage> <Zeit>          Tage: Mo Di Mi Do Fr Sa So, z. B.  energie-coach = So 18:00
#   mehrere Zeiten mit ;             z. B.  automationen = 08:00; Sa,So 12:00
#   <agent> = aus                    pausiert
#
# Sonderfall rezept-statistik: Uhrzeit der täglichen Rezept-Statistik in Slack (sendet die Slack-Brücke, kein Agent).
#
# <agent> ist der Ordnername unter agents/. Fehlt ein Agent hier, gilt "schedule" aus seiner agent.json.
# Eine neu eingetragene Zeit, die heute schon vorbei ist, gilt erst ab morgen.

automationen       = 08:00
log-detektiv       = 07:30
energie-coach      = So 18:00
automations-doktor = Sa 09:00
doktor-umsetzer    = alle 5 min
rezept-qualitaet   = 12:00
rezept-statistik   = 19:00
