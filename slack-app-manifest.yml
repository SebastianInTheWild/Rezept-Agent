# Slack-App „Rezept-Helfer“ – api.slack.com/apps → Create New App → From a manifest → diesen Inhalt einfügen.
# Socket Mode: Der Container baut die Verbindung selbst auf, es braucht keine Adresse von außen.
display_information:
  name: Rezept-Helfer
  description: Importiert Rezepte nach Tandoor und bringt sie auf unseren Standard.
  background_color: "#3a5a40"
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - im:history
      - chat:write
      - commands
      - files:read
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Rezept-Helfer
    always_online: true
  # url: Pflichtfeld im Manifest-Editor, wird im Socket Mode aber nicht benutzt (Befehle kommen über die Socket-Verbindung)
  slash_commands:
    - command: /neuronen
      url: https://rezepte.hamm.schmalzbauer.work/slack/commands
      description: Wie viele Cloudflare-Neuronen für KI-Fotos heute noch frei sind
      should_escape: false
    - command: /statistik
      url: https://rezepte.hamm.schmalzbauer.work/slack/commands
      description: Rezept-Statistik – gesamt, geprüft, offen, noch zu prüfen
      should_escape: false
    - command: /offen
      url: https://rezepte.hamm.schmalzbauer.work/slack/commands
      description: Vorschläge, die auf deine Entscheidung warten (mit „neu“ alle noch einmal schicken)
      usage_hint: "[neu]"
      should_escape: false
    - command: /rezept
      url: https://rezepte.hamm.schmalzbauer.work/slack/commands
      description: Rezept in Tandoor suchen, mit Status
      usage_hint: "<Name>"
      should_escape: false
    - command: /ohne-bild
      url: https://rezepte.hamm.schmalzbauer.work/slack/commands
      description: Rezepte ohne Bild zeigen, mit Knopf für ein KI-Foto
      usage_hint: "[Anzahl | Name]"
      should_escape: false
    - command: /bild-neu
      url: https://rezepte.hamm.schmalzbauer.work/slack/commands
      description: Neues KI-Bild mit Google für ein Rezept
      usage_hint: "<Name | ID>"
      should_escape: false
    - command: /bild-alle
      url: https://rezepte.hamm.schmalzbauer.work/slack/commands
      description: Alle Rezeptbilder mit Google neu erzeugen (mit Rückfrage)
      should_escape: false
    - command: /pruefen
      url: https://rezepte.hamm.schmalzbauer.work/slack/commands
      description: Qualitätsprüfung jetzt starten
      usage_hint: "[Anzahl]"
      should_escape: false
    - command: /pro-tag
      url: https://rezepte.hamm.schmalzbauer.work/slack/commands
      description: Wie viele Rezepte täglich geprüft werden
      usage_hint: "[Anzahl]"
      should_escape: false
    - command: /wochenplan
      url: https://rezepte.hamm.schmalzbauer.work/slack/commands
      description: Essensplan aus euren Rezepten vorschlagen
      usage_hint: "[Tage] [Wünsche]"
      should_escape: false
    - command: /was-kochen
      url: https://rezepte.hamm.schmalzbauer.work/slack/commands
      description: Rezepte mit diesen Zutaten finden
      usage_hint: "<Zutaten>"
      should_escape: false
    - command: /hilfe
      url: https://rezepte.hamm.schmalzbauer.work/slack/commands
      description: Was der Rezept-Helfer kann
      should_escape: false
    - command: /google
      url: https://rezepte.hamm.schmalzbauer.work/slack/commands
      description: Google-Nutzung und geschätzte Kosten diesen Monat
      should_escape: false
